# All lengths are in metres and all angles reported by the program are in degrees.
camera:
  serial: null
  width: 1920
  height: 1080
  fps: 30

marker:
  dictionary: DICT_4X4_50
  id: 0
  size_m: 0.050

tracking:
  handeye_file: handeye_calibration.yaml
  robot_pose_file: robot_pose.json
  output_file: marker_pose.json
  show_window: true
  max_reprojection_error_px: 2.0
  smoothing_alpha: 0.05
  max_robot_pose_age_s: 0.25
